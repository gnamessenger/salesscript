<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이페이지 - 고가상품 세일즈 화법</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ 3rd LANDING: MYPAGE ============ -->

<div class="seller-bar">
  <div class="wrap">
    <div class="logo">S</div>
    <div class="name">salesscript</div>
  </div>
</div>

<div class="wrap">
  <div class="mypage-header">
    <div>
      <h1 style="font-size:20px;font-weight:900;">마이페이지</h1>
      <div class="email" id="user-email">로그인 확인 중...</div>
    </div>
    <button type="button" class="logout-btn" id="logout-btn" style="display:none;">로그아웃</button>
  </div>

  <div class="mypage-nav">
    <div class="active" data-tab="content">내 컨텐츠</div>
    <div data-tab="orders">구매내역</div>
    <div data-tab="info">내 정보</div>
    <div data-tab="store">🛒 스토어</div>
  </div>

  <div id="tab-content">
    <div id="content-list">
      <div class="empty-state">불러오는 중...</div>
    </div>
  </div>

  <div id="tab-orders" style="display:none;">
    <div id="orders-list">
      <div class="empty-state">불러오는 중...</div>
    </div>
  </div>

  <div id="tab-info" style="display:none;">
    <div class="order-card">
      <div class="pname">기본정보</div>
      <div class="meta" id="info-email">이메일: -</div>
    </div>
  </div>

  <div id="tab-store" style="display:none;">
    <div id="coupon-banner"></div>
    <div class="order-card">
      <div class="pname">더 필요한 자료가 있으신가요?</div>
      <div class="meta">아우라세일즈의 모든 자료를 한 곳에서 보고, 지금 갖고 계신 것과 묶어서 구매하시면 할인이 적용됩니다.</div>
      <a href="store.html" class="download-btn">🛒 전체 상품 보러가기</a>
    </div>
  </div>
</div>

<!-- PHONE CAPTURE MODAL -->
<div class="auth-overlay" id="phone-overlay">
  <div class="auth-modal">
    <div class="auth-close" id="phone-close">✕</div>
    <h3>연락처를 남겨주셔야 자료를 받으실 수 있어요</h3>
    <p class="sub">무료 특강 등 유용한 소식도 가장 먼저 알려드릴게요</p>
    <div class="field">
      <label>휴대폰 번호</label>
      <input type="tel" id="phone-input" class="review-input" placeholder="010-1234-5678">
    </div>
    <button type="button" class="auth-submit-btn" id="phone-submit-btn">저장하고 자료 받기</button>
    <div class="auth-msg" id="phone-msg"></div>
  </div>
</div>

<script>
  document.querySelectorAll('.mypage-nav div').forEach(function(nav){
    nav.addEventListener('click', function(){
      document.querySelectorAll('.mypage-nav div').forEach(function(n){n.classList.remove('active');});
      nav.classList.add('active');
      var tab = nav.getAttribute('data-tab');
      document.getElementById('tab-content').style.display = tab === 'content' ? 'block' : 'none';
      document.getElementById('tab-orders').style.display = tab === 'orders' ? 'block' : 'none';
      document.getElementById('tab-info').style.display = tab === 'info' ? 'block' : 'none';
      document.getElementById('tab-store').style.display = tab === 'store' ? 'block' : 'none';
    });
  });
</script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script>
  document.getElementById('logout-btn').addEventListener('click', function(){
    auth.signOut().then(function(){
      window.location.href = 'index.html';
    });
  });

  var CONTENT_CARDS = {
    sales: function(){
      return '<div class="order-card">' +
        '<div class="pname">고가상품 세일즈 화법 완전정복</div>' +
        '<div class="meta">기간 제한 없음</div>' +
        '<a href="ebook-main.pdf" download class="download-btn">📖 대본집 전자책 다운로드 (1차+2차 통합)</a>' +
        '<a href="product.html#review" class="download-btn" style="background:var(--red);">🎁 후기 남기면 반론 스크립트 드려요</a>' +
        '</div>';
    },
    personal: function(){
      return '<div class="order-card">' +
        '<div class="pname">개인 보험 자료집 <span class="po-badge">준비중</span></div>' +
        '<div class="meta">현재 정리 중인 자료입니다. 완성되는 대로 이 페이지에서 바로 다운로드하실 수 있도록 안내드릴게요.</div>' +
        '</div>';
    },
    corporate: function(){
      return '<div class="order-card">' +
        '<div class="pname">법인 보험 자료집 <span class="po-badge">준비중</span></div>' +
        '<div class="meta">현재 정리 중인 자료입니다. 완성되는 대로 이 페이지에서 바로 다운로드하실 수 있도록 안내드릴게요.</div>' +
        '</div>';
    }
  };
  var PRODUCT_ORDER = ['sales', 'personal', 'corporate'];
  var userHasPhone = false;
  var lastOrderDocs = null;

  function renderOrders(docs){
    lastOrderDocs = docs;
    var ordersEl = document.getElementById('orders-list');
    var contentEl = document.getElementById('content-list');

    if(docs.length === 0){
      ordersEl.innerHTML = '<div class="empty-state">구매내역이 없습니다.<br>상품을 구매하시면 여기에 표시됩니다.</div>';
      contentEl.innerHTML = '<div class="empty-state">보유 중인 컨텐츠가 없습니다.</div>';
      return;
    }

    var CONTENT_INFO = {
      'sales-script': {
        name: '[대본집] 고가상품 세일즈 화법 완전정복',
        download: 'ebook-main.pdf',
        downloadLabel: '📖 대본집 전자책 다운로드 (1차+2차 통합)',
        reviewCta: true
      },
      'insurance-personal': { name: '보험 판매 화법 (개인)', download: null },
      'insurance-corporate': { name: '보험 판매 화법 (법인)', download: null }
    };

    var ordersHtml = '';
    var ownedItems = {};
    docs.forEach(function(doc){
      var d = doc.data();
      var dateStr = '';
      if(d.createdAt && d.createdAt.toDate){
        var dt = d.createdAt.toDate();
        dateStr = dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0') +
          ' ' + String(dt.getHours()).padStart(2,'0') + ':' + String(dt.getMinutes()).padStart(2,'0');
      }
      ordersHtml += '<div class="order-card">' +
        '<div class="pname">' + (d.productName || '') + '</div>' +
        '<div class="meta">주문일시: ' + (dateStr || '-') + '</div>' +
        '<div class="meta">결제금액: ' + (d.amount || 0).toLocaleString() + '원</div>' +
        '<div class="status">' + (d.status === 'completed' ? '결제완료' : d.status) + '</div>' +
        '</div>';

      var items = d.items && d.items.length ? d.items : ['sales-script'];
      items.forEach(function(id){ ownedItems[id] = true; });
    });
    ordersEl.innerHTML = ordersHtml;

    var contentHtml = '';
    Object.keys(ownedItems).forEach(function(id){
      var info = CONTENT_INFO[id];
      if(!info){ return; }
      contentHtml += '<div class="order-card">' +
        '<div class="pname">' + info.name + '</div>' +
        '<div class="meta">기간 제한 없음</div>';
      if(info.download && userHasPhone){
        contentHtml += '<a href="' + info.download + '" download class="download-btn">' + info.downloadLabel + '</a>';
      } else if(info.download && !userHasPhone){
        contentHtml += '<button type="button" class="download-btn" onclick="document.getElementById(\'phone-overlay\').classList.add(\'show\')">📱 연락처 남기고 자료 받기</button>';
      } else {
        contentHtml += '<div class="meta" style="margin-top:10px;color:var(--red);font-weight:700;">자료 준비 중입니다.</div>';
      }
      if(info.reviewCta){
        contentHtml += '<a href="product.html#review" class="download-btn" style="background:var(--red);">🎁 후기 남기면 반론 스크립트 드려요</a>';
      }
      contentHtml += '</div>';
    });

    var missing = Object.keys(CONTENT_INFO).filter(function(id){ return !ownedItems[id]; });
    if(missing.length){
      contentHtml += '<div class="order-card">' +
        '<div class="pname">더 담아보세요</div>' +
        '<div class="meta">아직 보유하지 않은 자료가 있어요. 2개 이상 담으면 묶음 할인이 적용됩니다.</div>' +
        '<a href="store.html" class="download-btn">🛒 추가 구매하러 가기</a>' +
        '</div>';
    }

    contentEl.innerHTML = contentHtml || '<div class="empty-state">보유 중인 컨텐츠가 없습니다.</div>';
  }

  auth.onAuthStateChanged(function(user){
    if(!user){
      window.location.href = 'index.html';
      return;
    }
    document.getElementById('user-email').textContent = user.displayName || user.email;
    document.getElementById('info-email').textContent = '이메일: ' + user.email;
    document.getElementById('logout-btn').style.display = 'inline-block';

    getUserProfile(user.uid).then(function(profile){
      userHasPhone = !!(profile && profile.phone);
      return db.collection('orders').where('uid', '==', user.uid).orderBy('createdAt', 'desc').get();
    }).then(function(snap){
      renderOrders(snap.docs);
    }).catch(function(err){
      console.error(err);
      document.getElementById('orders-list').innerHTML = '<div class="empty-state">구매내역을 불러오지 못했습니다.</div>';
      document.getElementById('content-list').innerHTML = '<div class="empty-state">컨텐츠를 불러오지 못했습니다.</div>';
    });

    getAvailableCoupon(user.uid).then(function(coupon){
      var bannerEl = document.getElementById('coupon-banner');
      if(!coupon){ bannerEl.innerHTML = ''; return; }
      bannerEl.innerHTML =
        '<div class="coupon-box" style="margin-bottom:16px;">' +
        '🎟️ ' + coupon.amount.toLocaleString() + '원 쿠폰 보유중 (' + coupon.minAmount.toLocaleString() + '원 이상 구매 시 스토어에서 자동 적용)' +
        '</div>';
    }).catch(function(err){ console.error(err); });
  });

  document.getElementById('phone-close').addEventListener('click', function(){
    document.getElementById('phone-overlay').classList.remove('show');
  });
  document.getElementById('phone-submit-btn').addEventListener('click', function(){
    var phone = document.getElementById('phone-input').value.trim();
    var msgEl = document.getElementById('phone-msg');
    if(!/^01[0-9]-?\d{3,4}-?\d{4}$/.test(phone)){
      msgEl.textContent = '올바른 휴대폰 번호를 입력해주세요. (예: 010-1234-5678)';
      return;
    }
    var user = auth.currentUser;
    if(!user) return;
    savePhoneNumber(user, phone).then(function(){
      userHasPhone = true;
      document.getElementById('phone-overlay').classList.remove('show');
      if(lastOrderDocs){ renderOrders(lastOrderDocs); }
    }).catch(function(err){
      msgEl.textContent = err.message;
    });
  });
</script>

</body>
</html>
